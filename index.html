<style>
:root{
  --bg:#EAF1F2; --surface:#FFFFFF; --surface2:#E0EAEC; --ink:#10232A; --muted:#566D75; --line:#CCDADD;
  --accent:#0A7C74; --accent-ink:#FFFFFF; --accent-soft:#D3EDEA;
  --hero:#0A5A55; --hero-ink:#F2FBFA; --hero-muted:#A9D3CF;
  --sun:#F0AE2B; --sun-ink:#3A2900;
  --bad:#C23B27; --good:#23794A; --warn:#9A5F06;
  --c-surat:#2F6FDE; --c-dokumen:#0A9A84; --c-rapat:#D9822B; --c-monev:#8A5CD6; --c-dinas:#D64F7A; --c-lain:#6B8290;
  --shadow:0 1px 2px rgba(16,35,42,.06),0 10px 28px -14px rgba(16,35,42,.22);

  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B181C; --surface:#12252A; --surface2:#1A3036; --ink:#E5F0F0; --muted:#8CA7AD; --line:#26414A;
  --accent:#3CC4B6; --accent-ink:#06201D; --accent-soft:#17413F;
  --hero:#0F3B3A; --hero-ink:#EAF8F6; --hero-muted:#8FC3BE;
  --sun:#F5C04F; --sun-ink:#3A2900;
  --bad:#FF8A73; --good:#5CD08C; --warn:#F2B552;
  --c-surat:#6C9BFF; --c-dokumen:#3CC4B6; --c-rapat:#F2A24D; --c-monev:#B08CFF; --c-dinas:#FF7FA6; --c-lain:#93A9B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B181C; --surface:#12252A; --surface2:#1A3036; --ink:#E5F0F0; --muted:#8CA7AD; --line:#26414A;
  --accent:#3CC4B6; --accent-ink:#06201D; --accent-soft:#17413F;
  --hero:#0F3B3A; --hero-ink:#EAF8F6; --hero-muted:#8FC3BE;
  --sun:#F5C04F; --sun-ink:#3A2900;
  --bad:#FF8A73; --good:#5CD08C; --warn:#F2B552;
  --c-surat:#6C9BFF; --c-dokumen:#3CC4B6; --c-rapat:#F2A24D; --c-monev:#B08CFF; --c-dinas:#FF7FA6; --c-lain:#93A9B4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand svg,.brand img{width:34px;height:34px;border-radius:10px;flex:none;display:block}
.top-actions{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.main{min-width:0;padding-bottom:24px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}

@media (min-width:900px){

  .app{grid-template-columns:230px minmax(0,1fr);gap:32px}
  .top,.tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:24px 0;height:100vh;max-height:100dvh}

}
.side .who{font-size:13px;color:var(--muted);line-height:1.4;padding:0 4px}
.side .who b{display:block;color:var(--ink);font-size:14px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
.page-head h1{font-size:clamp(26px,5vw,34px);font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.section{margin-top:26px}
.section>h2{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--ink);max-width:100%}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--c-lain));flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.baru{color:var(--muted)} .pill.proses{color:var(--accent)} .pill.menunggu{color:var(--warn)} .pill.selesai{color:var(--good)}
.pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.ok{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:13.5px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:24px 124px 24px 22px;min-height:268px;display:grid;gap:20px;grid-template-columns:1fr;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--hero-ink) 22%,transparent);pointer-events:none}
.hero .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.hero h1{font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1.05;margin:4px 0 0}
.hero p{margin:0;color:var(--hero-muted);max-width:46ch;font-size:14.5px}
.ring{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ring svg{width:84px;height:84px;flex:none}
.ring .num{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.ring .sub{font-size:13px;color:var(--hero-muted);margin-top:4px}
.hero-text{position:relative;z-index:1;display:grid;gap:10px}
.bubble{position:relative;margin:0;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);color:var(--hero-ink);font-size:14px;line-height:1.45;max-width:38ch}
.hero .bubble{color:var(--hero-ink);font-size:14px}
.bubble::after{content:"";position:absolute;right:-8px;top:18px;border:8px solid transparent;border-right:0;border-left-color:rgba(255,255,255,.2)}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.88);opacity:.2}to{transform:none;opacity:1}}
.stage{position:absolute;right:6px;bottom:0;z-index:2}
.mascot{display:block;position:relative;height:232px;aspect-ratio:255/620;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mascot::before{content:"";position:absolute;left:6%;right:-6%;bottom:-2px;height:10px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(3px);animation:shadow 3.6s ease-in-out infinite}
.mascot img{position:relative;width:100%;height:100%;display:block;transform-origin:50% 100%;animation:idle 3.6s ease-in-out infinite;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mascot.enter img{animation:enter .9s cubic-bezier(.2,1.2,.4,1) both,idle 3.6s ease-in-out .9s infinite}
.mascot.hop img{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
.mascot.cheer img{animation:cheer 1.1s ease-in-out}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1) rotate(0)}25%{transform:translateY(-3px) scale(.995,1.012) rotate(.7deg)}50%{transform:translateY(-5px) scale(.99,1.025) rotate(0)}75%{transform:translateY(-3px) scale(.995,1.012) rotate(-.7deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.86);opacity:.65}}
@keyframes enter{0%{transform:translateY(70px) scale(.92,1.08);opacity:0}60%{transform:translateY(-10px) scale(1.03,.97);opacity:1}100%{transform:none;opacity:1}}
@keyframes hop{0%{transform:scale(1.05,.93)}30%{transform:translateY(-26px) scale(.97,1.05)}60%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-5px)}100%{transform:none}}
@keyframes cheer{0%,100%{transform:none}18%{transform:translateY(-32px) rotate(-7deg)}36%{transform:translateY(0) rotate(0)}54%{transform:translateY(-32px) rotate(7deg)}72%{transform:translateY(0) rotate(0)}86%{transform:translateY(-8px)}}
.chips{display:none}
.fl{position:absolute;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:floaty 4.2s ease-in-out infinite}
.fl .ic{width:26px;height:26px}
.fl.a{background:var(--c-surat);left:-92px;top:34px}
.fl.b{background:var(--sun);color:var(--sun-ink);right:-36px;top:70px;animation-delay:-1.4s;width:46px;height:46px}
.fl.c{background:#27A06B;left:-66px;top:172px;animation-delay:-2.6s;width:44px;height:44px}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@media (min-width:700px){.hero{grid-template-columns:1fr;align-content:center;padding:30px 300px 30px 34px;min-height:334px}.ring svg{width:104px;height:104px}.ring .num{font-size:28px}.stage{right:44px}.mascot{height:308px}.chips{display:block}}
.av{display:inline-block;width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;background:var(--mascot) 48% calc(var(--s,40px) * -.02)/130% auto no-repeat var(--accent-soft)}
.empty::before{content:"";display:block;width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--mascot) 48% -2px/130% auto no-repeat var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:2px;text-align:left}

.two{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:1000px){.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.quick{display:grid;grid-template-columns:1fr;gap:8px;padding:14px;margin-bottom:16px}

@media (min-width:560px){.quick{grid-template-columns:1fr auto auto auto}.quick .qrow{display:contents}}
.trail{position:relative;margin:0;padding:0;list-style:none;display:grid;gap:0}
.band{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:14px 0 4px 34px}
.band:first-child{margin-top:0}

.node:last-child::before{display:none}

.alist{display:grid;gap:10px}
.aitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}

.aitem .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.paper a{color:#0B57D0}
.drv-st{font-size:13px;color:var(--muted)}
.drv-st.ok{color:var(--good);font-weight:600}
.drv-st.bad{color:var(--bad);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 220px;min-width:0}

.search input{padding-left:38px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}

.fmain{min-width:0}
.fmain .n{font-weight:600;overflow-wrap:anywhere}
.fmain .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.fact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rlayout{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:1000px){.rlayout{grid-template-columns:290px minmax(0,1fr);align-items:start}}
.panel{padding:18px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#paper,.rlayout>*{min-width:0}
.paper{background:#fff;color:#111;border-radius:6px;padding:26px 24px;box-shadow:var(--shadow);overflow-x:auto}
.paper h2{font-family:'Times New Roman',Times,serif;text-align:center;font-size:17px;letter-spacing:.04em;margin:0 0 2px;text-transform:uppercase}
.paper .per{text-align:center;font-size:13px;margin-bottom:14px;color:#333}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:0 0 14px}
.paper dt{color:#444} .paper dd{margin:0}
.paper table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.paper th,.paper td{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left}
.paper th{background:#e8ecec}
.paper .sum{margin:10px 0 0;font-size:12.5px;color:#333}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-size:13px;min-width:640px}
.paper .sign div{display:grid;gap:0;align-content:start}
.paper .sign .sp{height:54px}
.paper .sign .r{text-align:left}
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(7,18,21,.6)}
dialog[open]{display:flex;flex-direction:column}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:20px;font-weight:800}
.db{padding:18px 20px;overflow-y:auto;display:grid;gap:14px}
.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.df .sp{flex:1}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:15px}
textarea{resize:vertical;min-height:84px}
.sub-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.sub-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.mini-list{display:grid;gap:6px}
.mini{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.mini span{overflow-wrap:anywhere}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:100;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast .av{--s:30px}
.toast.hopx .av{animation:hop .7s}
@media (min-width:900px){.toast{bottom:28px}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;width:8px;height:12px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

var idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    try{var r=indexedDB.open('jejak-kerja-berkas',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('f')};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}
  });return idbP;
}
function idbDo(mode,fn){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('f',mode),s=t.objectStore('f'),q=fn(s);t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
var idbPut=function(id,blob){return idbDo('readwrite',function(s){return s.put(blob,id)})};
var idbGet=function(id){return idbDo('readonly',function(s){return s.get(id)})};
var idbDel=function(id){return idbDo('readwrite',function(s){return s.delete(id)}).catch(function(){})};

function download(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
}

/* ================= Google Drive (OAuth 2.0 + Drive API v3) ================= */
// MASBRO: Ganti nilai DEFAULT_CLIENT_ID ini dengan Client ID dari Google Cloud Console
var DEFAULT_CLIENT_ID = 'MASUKKAN_CLIENT_ID_ANDA_DISINI.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file email profile';
var FOLDER_UTAMA = 'Jejak Kerja';

var fileById=function(id){return db.files.filter(function(f){return f.id===id})[0]};
var isUrl=function(x){return /^https?:\/\//i.test(x||'')};
var fileUrl=function(f){return f&&f.drive&&f.drive.url?f.drive.url:(f&&isUrl(f.lokasi)?f.lokasi:'')};

function getClientId(){
  var c=db.profile&&db.profile.drive&&db.profile.drive.clientId;
  return (c&&c.trim())||DEFAULT_CLIENT_ID;
}
function driveCfg(){
  var c=db.profile&&db.profile.drive;
  return c&&c.connected?c:null;
}
function folderIdFrom(s){
  s=(s||'').trim();if(!s)return '';
  var m=s.match(/folders\/([A-Za-z0-9_-]+)/)||s.match(/[?&]id=([A-Za-z0-9_-]+)/);
  if(m)return m[1];
  return /^[A-Za-z0-9_-]{15,}$/.test(s)?s:'';
}
function bersihNama_(s){
  var t=String(s||'').replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,90);
  return t||'berkas';
}
function errMsg(e){
  var m=(e&&e.message)||String(e);
  if(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Gagal menghubungi Google Drive. Periksa koneksi internet Anda.';
  return m;
}

function ensureGoogleToken(interactive){
  return new Promise(function(res,rej){
    var d=(db.profile&&db.profile.drive)||{};
    if(d.token&&d.exp&&Date.now()<d.exp-60000)return res(d.token);
    if(!window.google||!google.accounts||!google.accounts.oauth2){
      return rej(new Error('Layanan login Google belum siap. Periksa internet Anda lalu coba lagi.'));
    }
    var cid=getClientId();
    if(!cid||cid.indexOf('MASUKKAN_CLIENT_ID')===0){
      return rej(new Error('Google Client ID belum diisi. Buka Profil > Pengaturan Admin (Client ID).'));
    }
    var client=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:DRIVE_SCOPE,
      hint:d.email||'',
      callback:function(resp){
        if(resp.error)return rej(new Error('Login Google gagal atau dibatalkan ('+resp.error+')'));
        db.profile.drive=Object.assign({},db.profile.drive||{akses:'tautan',folder:''},{
          connected:true,
          token:resp.access_token,
          exp:Date.now()+((resp.expires_in||3599)*1000)
        });
        fetch('https://www.googleapis.com/oauth2/v3/userinfo',{
          headers:{Authorization:'Bearer '+resp.access_token}
        }).then(function(r){return r.ok?r.json():{}}).then(function(u){
          if(u.email)db.profile.drive.email=u.email;
          if(u.name)db.profile.drive.userName=u.name;
          save();res(resp.access_token);
        }).catch(function(){save();res(resp.access_token)});
      },
      error_callback:function(err){
        rej(new Error('Gagal membuka jendela login Google ('+(err&&err.type||'popup')+')'));
      }
    });
    client.requestAccessToken({prompt:interactive?'select_account':''});
  });
}

function gdriveSubFolder_(token,nama,parentId){
  var clean=bersihNama_(nama);
  var q="mimeType='application/vnd.google-apps.folder' and trashed=false and name='"+clean.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
  if(parentId)q+=" and '"+parentId+"' in parents";
  var url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,webViewLink)&spaces=drive';
  return fetch(url,{headers:{Authorization:'Bearer '+token}})
    .then(function(r){if(!r.ok)throw new Error('Gagal mengakses folder Google Drive ('+r.status+')');return r.json()})
    .then(function(j){
      if(j.files&&j.files.length)return j.files[0];
      var meta={name:clean,mimeType:'application/vnd.google-apps.folder'};
      if(parentId)meta.parents=[parentId];
      return fetch('https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink',{
        method:'POST',
        headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify(meta)
      }).then(function(r2){if(!r2.ok)throw new Error('Gagal membuat folder di Google Drive');return r2.json()});
    });
}

function gdriveRootFolder_(token,cfg){
  var customId=folderIdFrom(cfg&&cfg.folder);
  if(customId){
    return fetch('https://www.googleapis.com/drive/v3/files/'+customId+'?fields=id,name,webViewLink',{
      headers:{Authorization:'Bearer '+token}
    }).then(function(r){
      if(!r.ok)throw new Error('Folder tujuan tidak ditemukan atau tidak memiliki izin akses.');
      return r.json();
    });
  }
  return gdriveSubFolder_(token,FOLDER_UTAMA,'');
}

function driveUpload(f,blob){
  var cfg=driveCfg();
  if(!cfg)return Promise.reject(new Error('Akun Google Drive belum dihubungkan.'));
  if(blob.size>25*1024*1024)return Promise.reject(new Error('File lebih dari 25 MB. Kecilkan dulu atau unggah langsung lewat Drive.'));
  var w=workById(f.workId),sub=[(f.tgl||today()).slice(0,7)];
  if(w)sub.push(w.judul);
  var tokenAktif='';
  return ensureGoogleToken(false)
    .then(function(tk){
      tokenAktif=tk;
      return gdriveRootFolder_(tk,cfg);
    })
    .then(function(rootFolder){
      return sub.reduce(function(p,namaSub){
        return p.then(function(parent){return gdriveSubFolder_(tokenAktif,namaSub,parent.id)});
      },Promise.resolve(rootFolder));
    })
    .then(function(targetFolder){
      var boundary='-------JejakKerjaBoundary'+Date.now();
      var meta={name:bersihNama_(blob.name||f.nama),parents:[targetFolder.id]};
      var bodyBlob=new Blob([
        '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
        JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: '+(blob.type||'application/octet-stream')+'\r\n\r\n',
        blob,
        '\r\n--'+boundary+'--'
      ],{type:'multipart/related; boundary='+boundary});

      return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{
        method:'POST',
        headers:{Authorization:'Bearer '+tokenAktif},
        body:bodyBlob
      });
    })
    .then(function(r){if(!r.ok)throw new Error('Gagal mengunggah file ke Google Drive ('+r.status+')');return r.json()})
    .then(function(fileRes){
      if(cfg.akses!=='pribadi'){
        return fetch('https://www.googleapis.com/drive/v3/files/'+fileRes.id+'/permissions',{
          method:'POST',
          headers:{Authorization:'Bearer '+tokenAktif,'Content-Type':'application/json'},
          body:JSON.stringify({role:'reader',type:'anyone'})
        }).then(function(){return {ok:true,id:fileRes.id,url:fileRes.webViewLink,nama:fileRes.name}})
          .catch(function(){return {ok:true,id:fileRes.id,url:fileRes.webViewLink,nama:fileRes.name}});
      }
      return {ok:true,id:fileRes.id,url:fileRes.webViewLink,nama:fileRes.name};
    });
}

function storeFile(f,blob){
  var cfg=driveCfg(),limit=25*1024*1024;
  if(blob.size>limit)return Promise.resolve({where:'toobig'});
  var local=function(pending,err){
    return idbPut(f.id,blob).then(function(){
      f.lampiran={nama:blob.name||f.nama,size:blob.size,tipe:blob.type};
      if(pending)f.pendingDrive=1;else delete f.pendingDrive;
      delete f.drive;
      return {where:pending?'pending':'local',err:err};
    }).catch(function(){return {where:'fail',err:err}});
  };
  if(!cfg)return local(false);
  return driveUpload(f,blob).then(function(res){
    f.drive={id:res.id,url:res.url,nama:res.nama};delete f.lampiran;delete f.pendingDrive;idbDel(f.id);return {where:'drive'};
  }).catch(function(err){return local(true,err)});
}
function uploadPending(id,btn){
  var f=fileById(id);if(!f||!driveCfg())return;
  if(btn){btn.disabled=true;btn.textContent='Mengunggah…'}
  idbGet(id).then(function(blob){
    if(!blob)throw new Error('File di perangkat tidak ditemukan');
    if(!blob.name)blob=new File([blob],f.lampiran&&f.lampiran.nama||f.nama,{type:blob.type});
    return driveUpload(f,blob);
  }).then(function(res){
    f.drive={id:res.id,url:res.url,nama:res.nama};delete f.pendingDrive;delete f.lampiran;idbDel(id);save();paintFileList();toast('Terunggah ke Google Drive');
  }).catch(function(e){toast(errMsg(e));if(btn){btn.disabled=false;btn.textContent='Unggah ke Drive'}});
}

  });

function dueBadge(w){
  if(w.status==='selesai')return '<span class="pill selesai">Selesai</span>';
  if(!w.tenggat)return '<span class="pill ok">Tanpa tenggat</span>';
  var n=diffDays(w.tenggat,today());
  if(n<0)return '<span class="pill bad">Terlambat '+(-n)+' hari</span>';
  if(n===0)return '<span class="pill warn">Hari ini</span>';
  if(n<=3)return '<span class="pill warn">'+n+' hari lagi</span>';
  return '<span class="pill ok">'+fmtShort(w.tenggat)+'</span>';
}

function repRange(){
  var p=ui.rep.per,t=today(),d=fromIso(t);
  if(p==='hari')return [t,t];
  if(p==='minggu'){var o=(d.getDay()+6)%7;return [addDays(t,-o),addDays(t,6-o)]}
  if(p==='bulan')return [iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))];
  if(p==='lalu')return [iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))];
  var a=ui.rep.from,b=ui.rep.to;return a<=b?[a,b]:[b,a];
}
function repLabel(r){return r[0]===r[1]?fmtLong(r[0]):fmtDate(r[0])+' s.d. '+fmtDate(r[1])}
function buildReport(){
  var r=repRange(),p=db.profile,out={meta:[['Nama',p.nama||'-'],['NIP',p.nip||'-'],['Jabatan',p.jabatan||'-'],['Unit kerja',p.unit||'-']],range:r,period:repLabel(r)};
  if(ui.rep.jenis==='kinerja'){
    var logs=db.logs.filter(function(l){return l.tgl>=r[0]&&l.tgl<=r[1]}).sort(byTime),last='',n=0,tot=0,days={},nl=0;
    out.title='Laporan Kinerja Harian';out.sheet='Kinerja Harian';
    out.head=['No','Hari / Tanggal','Waktu','Uraian kegiatan','Output','Keterangan','Bukti dukung'];out.widths=[5,24,14,56,14,34,48];
    out.rows=logs.map(function(l){n++;tot+=dur(l);days[l.tgl]=1;var w=workById(l.workId),fl=fileById(l.fileId),items=[];
      if(fl){items.push(fileItem(fl));if(fileUrl(fl))nl++}
      if(l.bukti)items.push({n:l.bukti,u:isUrl(l.bukti)?l.bukti:''});
      var row=[n,l.tgl!==last?fmtLong(l.tgl):'',l.mulai+' - '+l.selesai,l.uraian,l.output?(l.output+' '+(l.satuan||'')).trim():'',w?w.judul:'',items.length?{items:items}:''];last=l.tgl;return row});
    out.summary='Total '+logs.length+' kegiatan pada '+Object.keys(days).length+' hari, '+fmtDur(tot)+'. '+nl+' kegiatan memiliki tautan bukti dukung.';
  }else{
    out.title='Rekap Pekerjaan';out.sheet='Rekap Pekerjaan';
    out.head=['No','Pekerjaan','Jenis','Asal perintah / No. surat','Tenggat','Status','Langkah','Berkas (tautan)'];out.widths=[5,46,22,34,14,18,10,52];
    var ws=db.works.filter(function(w){return (w.dibuat||'0000')<=r[1]&&(w.status!=='selesai'||(w.selesaiTgl||r[0])>=r[0])}).sort(function(a,b){return (a.tenggat||'9999').localeCompare(b.tenggat||'9999')});
    var k=0,sel=0;
    out.rows=ws.map(function(w){k++;if(w.status==='selesai')sel++;var st=w.subtasks||[],fl=db.files.filter(function(f){return f.workId===w.id});
      return [k,w.judul,KAT[w.kat]?KAT[w.kat].n:'',[w.asal,w.noSurat].filter(Boolean).join(' / '),w.tenggat?fmtDate(w.tenggat):'-',STATUS[w.status],st.length?st.filter(function(x){return x.d}).length+'/'+st.length:'-',fl.length?{items:fl.map(fileItem)}:'']});
    out.summary='Total '+ws.length+' pekerjaan: '+sel+' selesai, '+(ws.length-sel)+' masih berjalan.';
  }
  return out;
}

   +'<div class="field"><span class="lbl">Cadangan data</span><div class="row"><button class="btn sm" type="button" data-act="backup">'+ic('down')+'Unduh cadangan (.json)</button><label class="btn sm" for="restoreFile">'+ic('up')+'Pulihkan dari cadangan</label><input type="file" id="restoreFile" accept="application/json,.json" class="sr"></div>'
   +'<small class="muted">Data tersimpan di peramban perangkat ini. Unduh cadangan sebelum ganti perangkat atau menghapus data peramban.</small></div>'
   +'<div class="field"><span class="lbl">Hapus data</span><div class="row"><button class="btn sm danger" type="button" data-act="wipe" id="btnWipe">Hapus semua data</button></div></div></form>'
   +'<div class="df"><span class="sp"></span><button class="btn" type="button" data-act="closeDlg">Batal</button><button class="btn primary" type="button" data-act="saveSettings">Simpan</button></div>');
}

/* ================= aksi ================= */
function applyTheme(){var t=db.prefs&&db.prefs.theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function wipeSamples(){
  db.works=db.works.filter(function(x){return !x.sample});db.logs=db.logs.filter(function(x){return !x.sample});db.files=db.files.filter(function(x){return !x.sample});
}
var acts={
  mascot:function(){var p=mascotPool();ui.mi=(ui.mi+1)%p.length;say(p[ui.mi]);mascotAct('hop')},
  closeDlg:function(){closeDlg()},
  backSettings:function(){openSettings()},
  driveLogin:function(){
    if($('#sform'))db.profile.drive=readDriveForm();
    var st=$('#drv-st');
    if(st){st.className='drv-st';st.textContent='Membuka jendela login Google…'}
    ensureGoogleToken(true).then(function(tk){
      return gdriveRootFolder_(tk,db.profile.drive);
    }).then(function(fld){
      save();
      if(dlg.open&&$('#sform'))openSettings();
      else render(true);
      toast('Berhasil terhubung ke Google Drive ('+fld.name+')');
    }).catch(function(e){
      if(st){st.className='drv-st bad';st.textContent=errMsg(e)}
      else toast(errMsg(e));
    });
  },
  driveLogout:function(){
    var d=db.profile&&db.profile.drive;
    if(d&&d.token&&window.google&&google.accounts&&google.accounts.oauth2){
      try{google.accounts.oauth2.revoke(d.token,function(){})}catch(e){}
    }
    db.profile.drive={connected:false,akses:(d&&d.akses)||'tautan',folder:(d&&d.folder)||'',clientId:(d&&d.clientId)||''};
    save();
    if(dlg.open&&$('#sform'))openSettings();
    render(true);
    toast('Koneksi Google Drive diputuskan');
  },
  driveTest:function(){
    db.profile.drive=readDriveForm();
    var st=$('#drv-st');st.className='drv-st';st.textContent='Memeriksa folder di Google Drive…';
    ensureGoogleToken(false).then(function(tk){
      return gdriveRootFolder_(tk,db.profile.drive);
    }).then(function(fld){
      st.textContent='Terhubung! Folder aktif: '+fld.name;
      st.className='drv-st ok';
    }).catch(function(e){
      st.textContent=errMsg(e);
      st.className='drv-st bad';
    });
  },
  closeFileDlg:function(){closeDlg();if(fReturnWork){var id=fReturnWork;fReturnWork=null;openWork(id)}},
  theme:function(){var cur=document.documentElement.getAttribute('data-theme')||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');db.prefs.theme=cur==='dark'?'light':'dark';save();applyTheme()},
  settings:function(){openSettings()},
  clearSample:function(){wipeSamples();save();render(true);toast('Data contoh dihapus. Selamat mulai dari nol.')},
  newWork:function(){openWork(null)},
  newFile:function(){fReturnWork=null;openFile(null)},
  newLog:function(){openLog(null)},
  addSub:function(){var i=$('#w-newsub');if(i.value.trim()){readWorkForm();paintSubs();i.focus()}},
  saveWork:function(){var r=commitWork();if(!r)return;closeDlg();render(true);toast('Pekerjaan disimpan');if(r.justDone)confetti()},
  delWork:function(b){
    if(!b.dataset.sure){b.dataset.sure=1;b.innerHTML=ic('trash')+'Yakin hapus?';return}
    var id=wDraft.id;db.files.filter(function(f){return f.workId===id}).forEach(function(f){f.workId=''});db.logs.forEach(function(l){if(l.workId===id)l.workId=''});
    db.works=db.works.filter(function(w){return w.id!==id});save();closeDlg();render(true);toast('Pekerjaan dihapus. Berkas dan catatannya tetap ada.');
  },
  fileForWork:function(){var r=commitWork();if(!r)return;fReturnWork=r.w.id;render(true);openFile(null,{workId:r.w.id})},
  saveLog:function(){logWithUpload(function(l,r){ui.date=l.tgl;closeDlg();render(true);toast(r?storeMsg(r):'Kegiatan dicatat')})},
  saveLogMore:function(){logWithUpload(function(l,r){ui.date=l.tgl;var end=l.selesai,d=l.tgl;render(true);openLog(null,{tgl:d,mulai:end,selesai:fromMin(toMin(end)+60)});toast(r?storeMsg(r):'Tersimpan. Lanjut catat kegiatan berikutnya.')})},
  delLog:function(){db.logs=db.logs.filter(function(l){return l.id!==lDraft.id});save();closeDlg();render(true);toast('Catatan dihapus')},
  saveFile:function(){
    var g=function(i){return $('#'+i).value},f=fDraft,er=$('#f-err');
    var inp=$('#f-file');fFile=inp&&inp.files&&inp.files[0]||null;
    f.nama=g('f-n').trim();f.jenis=g('f-j');f.tgl=g('f-t');f.nomor=g('f-no').trim();f.workId=g('f-w');f.lokasi=g('f-l').trim();f.ket=g('f-k').trim();
    if(!f.nama&&fFile)f.nama=fFile.name.replace(/\.[^.]+$/,'');
    if(!f.nama){er.textContent='Nama berkas belum diisi.';return}
    var fin=function(r){
      var ex=fileById(f.id);
      if(ex)db.files[db.files.indexOf(ex)]=f;else db.files.push(f);
      save();closeDlg();var back=fReturnWork;fReturnWork=null;render(true);toast(storeMsg(r));if(back)openWork(back);
    };
    if(!fFile){fin({where:'none'});return}
    busyDlg(true,driveCfg()?'Mengunggah ke Google Drive…':'Menyimpan file…');
    storeFile(f,fFile).then(function(r){
      busyDlg(false);
      if(r.where==='toobig'){er.textContent='File terlalu besar (maks. 25 MB). Simpan di Drive lalu catat tautannya.';return}
      fin(r);
    });
  },
  delFile:function(b){
    if(!b.dataset.sure){b.dataset.sure=1;b.innerHTML=ic('trash')+'Yakin hapus?';return}
    var id=fDraft.id;db.files=db.files.filter(function(x){return x.id!==id});idbDel(id);save();closeDlg();var back=fReturnWork;fReturnWork=null;render(true);toast('Berkas dihapus');if(back)openWork(back);
  },
  exportXlsx:exportXlsx,exportDoc:exportDoc,
  saveSettings:function(){
    var g=function(i){return $('#'+i).value.trim()},p=db.profile;
    p.nama=g('s-nama');p.nip=g('s-nip');p.jabatan=g('s-jab');p.unit=g('s-unit');p.atasan=g('s-atasan');p.nipAtasan=g('s-nipa');p.jabatanAtasan=g('s-jaba');p.kota=g('s-kota');
    var t=parseFloat($('#s-target').value.replace(',','.'));p.targetJam=t>0&&t<=12?t:7.5;p.drive=readDriveForm();save();closeDlg();render(true);toast('Profil disimpan');
  },
  backup:function(){var cp=JSON.parse(JSON.stringify(db));if(cp.profile&&cp.profile.drive)delete cp.profile.drive.token;download(new Blob([JSON.stringify(cp,null,1)],{type:'application/json'}),'jejak-kerja-cadangan-'+today()+'.json');toast('Cadangan diunduh')},
  wipe:function(b){
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Klik lagi untuk menghapus semuanya';return}
    db.files.forEach(function(f){if(f.lampiran)idbDel(f.id)});db.works=[];db.logs=[];db.files=[];save();closeDlg();render(true);toast('Semua data dihapus');
  }
};

function openAtt(id){
  var f=db.files.filter(function(x){return x.id===id})[0];if(!f)return;
  idbGet(id).then(function(blob){
    if(!blob){toast('File lampiran tidak ditemukan di peramban ini');return}
    var u=URL.createObjectURL(blob),w=null;try{w=window.open(u,'_blank')}catch(e){}
    if(!w)download(blob,f.lampiran?f.lampiran.nama:f.nama);
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }).catch(function(){toast('File lampiran tidak dapat dibuka')});
}

function wire(){
  dlg=$('#dlg');
  document.addEventListener('click',function(e){
    var t=e.target,b;
    if((b=t.closest('[data-act]'))){var a=acts[b.dataset.act];if(a){e.preventDefault();a(b,e)}return}
    if((b=t.closest('[data-go]'))){location.hash='#'+b.dataset.go;return}
    if((b=t.closest('[data-open-work]'))){if(dlg.open)closeDlg();openWork(b.dataset.openWork);return}
    if((b=t.closest('[data-toggle-done]'))){
      var w=workById(b.dataset.toggleDone);if(!w)return;
      if(w.status==='selesai'){w.status='proses';delete w.selesaiTgl}else{w.status='selesai';w.selesaiTgl=today();confetti();toast('Satu pekerjaan selesai. Mantap.')}
      save();render(true);return}
    if((b=t.closest('[data-wf]'))){ui.wf=b.dataset.wf;renderWorks();return}
    if((b=t.closest('[data-edit-log]'))){openLog(b.dataset.editLog);return}
    if((b=t.closest('[data-date]'))){ui.date=b.dataset.date;renderLogs();return}
    if((b=t.closest('[data-shift]'))){ui.date=addDays(ui.date,+b.dataset.shift);renderLogs();return}
    if((b=t.closest('[data-tpl]'))){var tp=TPL[+b.dataset.tpl],pre={uraian:tp[0]};if(tp[1]){pre.mulai=tp[1];pre.selesai=tp[2]}openLog(null,pre);return}
    if((b=t.closest('[data-edit-file]'))){fReturnWork=b.dataset.fromWork?wDraft.id:null;if(b.dataset.fromWork){var rr=commitWork();if(!rr)return;fReturnWork=rr.w.id;render(true)}openFile(b.dataset.editFile);return}
    if((b=t.closest('[data-open-att]'))){openAtt(b.dataset.openAtt);return}
    if((b=t.closest('[data-copy]'))){var f=fileById(b.dataset.copy);
      if(f){var cp=fileUrl(f)||f.lokasi,ok=function(){toast('Tersalin')},no=function(){toast('Salin manual: '+cp)};
        try{navigator.clipboard.writeText(cp).then(ok,no)}catch(x){no()}}return}
    if((b=t.closest('[data-drive-up]'))){uploadPending(b.dataset.driveUp,b);return}
    if((b=t.closest('[data-rj]'))){ui.rep.jenis=b.dataset.rj;renderReport();return}
    if((b=t.closest('[data-sub-del]'))){readWorkForm();wDraft.subtasks.splice(+b.dataset.subDel,1);paintSubs();return}
    if(t===dlg){closeDlg()}
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='wq'){ui.wq=t.value;paintWorkList()}
    else if(t.id==='fq'){ui.fq=t.value;paintFileList()}
    else if(t.dataset&&t.dataset.subText!=null){wDraft.subtasks[+t.dataset.subText].t=t.value}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='fj'){ui.fj=t.value;paintFileList()}
    else if(t.id==='datepick'){if(t.value){ui.date=t.value;renderLogs()}}
    else if(t.id==='rper'){ui.rep.per=t.value;renderReport()}
    else if(t.id==='rfrom'){ui.rep.from=t.value||today();paintPaper()}
    else if(t.id==='rto'){ui.rep.to=t.value||today();paintPaper()}
    else if(t.dataset&&t.dataset.subDone!=null){wDraft.subtasks[+t.dataset.subDone].d=t.checked?1:0}
    else if(t.id==='restoreFile'&&t.files&&t.files[0]){
      var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||d.v!==1||!d.works||!d.logs)throw 0;var keep=db.profile&&db.profile.drive;db=d;db.profile=db.profile||{};if(keep)db.profile.drive=keep;db.prefs=db.prefs||{theme:''};db.files=db.files||[];save();applyTheme();closeDlg();render(true);toast('Data dipulihkan dari cadangan')}catch(x){toast('Berkas cadangan tidak valid')}};fr.readAsText(t.files[0]);
    }
  });
  document.addEventListener('submit',function(e){
    e.preventDefault();
    if(e.target.id==='quick'){
      var u=$('#q-u').value.trim(),m=$('#q-m').value,s=$('#q-s').value;
      if(!u)return;if(toMin(s)<=toMin(m)){toast('Jam selesai harus setelah jam mulai');return}
      db.logs.push({id:uid(),tgl:today(),mulai:m,selesai:s,uraian:u,workId:'',output:'',satuan:'',bukti:''});save();render(true);toast('Tercatat di jalur hari ini');say('Tercatat. Terus semangat!');mascotAct('hop');
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.id==='w-newsub'){e.preventDefault();acts.addSub()}
  });
  window.addEventListener('hashchange',route);
}

/* ================= mulai ================= */
db=load();
if(!db){db=seed();save()}
db.prefs=db.prefs||{theme:''};db.profile=db.profile||{};
buildChrome();wire();applyTheme();route();
})();
</script>
